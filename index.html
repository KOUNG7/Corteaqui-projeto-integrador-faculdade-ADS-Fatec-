<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Corte Aqui - Login</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <svg class="logo-icone" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 C25 5 5 23 5 45 C5 63 17 78 35 83 L35 95 L50 82 C51 82 52 82 50 82 C75 82 95 65 95 45 C95 23 75 5 50 5 Z" fill="#2bc469"/>
            <line x1="35" y1="32" x2="65" y2="58" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            <line x1="65" y1="32" x2="35" y2="58" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            <circle cx="33" cy="60" r="6" fill="none" stroke="#ffffff" stroke-width="4"/>
            <circle cx="67" cy="60" r="6" fill="none" stroke="#ffffff" stroke-width="4"/>
        </svg>
        <div>
            <h1>Corte Aqui</h1>
            <p>Agende seu horário de beleza em poucos cliques</p>
        </div>
    </header>

    <main>
        <section>
            <h2>Entrar na sua conta</h2>

            <form action="#" method="post">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <label>
                    <input type="checkbox" id="lembrar" name="lembrar">
                    Lembrar de mim
                </label>

                <button type="submit">Entrar</button>

            </form>

            <p><a href="#">Esqueceu sua senha?</a></p>
            <p>Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Corte Aqui - Projeto Integrador FATEC Guarulhos</p>
    </footer>

</body>
</html>
