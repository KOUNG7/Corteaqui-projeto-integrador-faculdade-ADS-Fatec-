<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Corte Aqui - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="corteaqui.ico">
</head>
<body>

    <header>
        
        <img src="corteaqui.png">
        <div>
            <p>Agende seu horário em poucos cliques</p>
        </div>
    </header>

    <main>
        <section>
            <h2>Entrar na sua conta</h2>

            <form action="#" method="post">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <label>
                    <input type="checkbox" id="lembrar" name="lembrar">
                    Lembrar de mim
                </label>

                <button type="submit">Entrar</button>

            </form>

            <p><a >Esqueceu sua senha?</a></p>
            <p>Ainda não tem uma conta? <a>Cadastre-se aqui</a></p>
            <p><a href="agendamentocorteaqui.html"  target="blank">Pular</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Corte Aqui - Projeto Integrador FATEC Guarulhos</p>
    </footer>

</body>
</html>
