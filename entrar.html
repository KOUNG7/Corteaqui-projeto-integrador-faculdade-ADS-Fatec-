<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Corte Aqui</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logocorteaqui" src="corteaqui.ico" alt="Corte Aqui">

    <nav class="navagendamento">
      <h2><a href="index.html">Início</a></h2>
      <h2><a href="agendamento.html" target="_blank">Agendamento</a></h2>
     
    </nav>

    <div class="botao">
     
      <h2><a href="Cadastrar.html">Criar conta</a></h2>
    </div>

    <img class="logosalao" src="logo-newkids.png" alt="Salão infantil New Kids">
  </header>

    <main class="entrarmain">
    <form class="entrar" action="#" method="post">
      <div class="nomemarca">
        <h1>CorteAqui</h1>
        <p>Entre para agendar o seu horário</p>
      </div>

      <div class="campos">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
      </div>

      <a class="esquecisenha" href="#">Esqueci minha senha</a>

      <button class="botao-entrar" type="submit">Entrar</button>

      <p class="conta">Não tem conta? <a href="cadastro.html">Criar conta</a></p>

      <div class="pular">
        <hr>
        <span>ou</span>
        <hr>
      </div>

      <button class="btn-google" type="button">
        <img src="Google__G__logo.svg.webp" alt="">
        <span>Fazer login com o Google</span>
      </button>
    </form>
  </main>
</body>
</html>
