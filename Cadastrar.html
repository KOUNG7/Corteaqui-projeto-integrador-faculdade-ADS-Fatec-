<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Corte Aqui</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logocorteaqui" src="corteaqui.ico" alt="Corte Aqui">

    <nav class="navagendamento">
      <h2><a href="index.html">Início</a></h2>
      <h2><a href="agendamento.html">Agendamento</a></h2>
    </nav>

    <div class="botao">
      <h2><a href="entrar.html">Entrar</a></h2>
    </div>

    <img class="logosalao" src="logo-newkids.png" alt="Salão infantil New Kids">
  </header>

  <main class="entrarmain">
    <form class="entrar" id="formCadastro" action="#" method="post">
      <div class="nomemarca">
        <h1>CorteAqui</h1>
        <p>Crie sua conta para agendar o horário</p>
      </div>

      <div class="campos">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 90000-0000" autocomplete="tel" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" autocomplete="new-password" required>

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" minlength="8" autocomplete="new-password" required>
      </div>

      <button class="botao-entrar" type="submit">Criar conta</button>

      <p class="conta">Já tem conta? <a href="entrar.html">Entrar</a></p>

      <div class="pular">
        <hr>
        <span>ou</span>
        <hr>
      </div>

      <!-- Container oficial do Botão Google Identity Services -->
      <div id="g_id_onload"
           data-client_id="SEU_CLIENT_ID_DO_GOOGLE_AQUI.apps.googleusercontent.com"
           data-context="signup"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>

      <button class="btn-google" id="btnGoogleCustom" type="button">
        <img src="Google__G__logo.svg.webp" alt="">
        <span>Cadastrar com o Google</span>
      </button>

      <a class="link-pular" href="agendamento.html">Pular</a>
    </form>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
</body>
</html>
